<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>思想会客厅 · 天赋探索</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="思想会客厅" />
  <meta name="theme-color" content="#2b2118" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="stylesheet" href="/style.css?v=8" />
</head>
<body>
  <header class="hd">
    <h1>思想会客厅</h1>
    <p class="sub">让 25 位顶尖思想家，用他们的认知框架帮你思考</p>
    <div class="quota" id="quotaBar">免费次数：加载中…</div>
  </header>

  <main>
    <section class="block" id="profileBlock">
      <label class="lbl">先简单介绍下你自己<span class="pf-badge" id="pfBadge" hidden>已保存</span></label>
      <div class="pf-grid">
        <select id="pfGender" class="pf-in"><option value="">性别</option><option>男</option><option>女</option><option>不愿透露</option></select>
        <input id="pfAge" class="pf-in" type="number" inputmode="numeric" placeholder="年龄" />
        <input id="pfJob" class="pf-in" type="text" placeholder="职业" />
        <input id="pfHobby" class="pf-in" type="text" placeholder="兴趣" />
        <input id="pfSkill" class="pf-in" type="text" placeholder="特长（选填）" />
      </div>
      <textarea id="pfMore" rows="2" placeholder="其他补充（选填）：当前困境、目标等"></textarea>
      <button id="pfSave" class="ghost">保存我的画像</button>
      <small class="pf-status" id="pfStatus"></small>
    </section>
    <section class="block">
      <label class="lbl">① 选择一位或多位「大师」（支持一次全选 25 位并排对照）</label>
      <button type="button" class="picker-toggle" id="pickerToggle" aria-expanded="false">
        <span id="pickerLabel">点此选择大师</span><span class="caret">▾</span>
      </button>
      <div class="picked" id="picked"></div>
      <div class="picker-panel" id="pickerPanel" hidden>
        <input id="pickerSearch" class="pf-in" type="search" placeholder="搜索大师，如：芒格、老子、Jobs" />
        <div class="picker-actions">
          <button type="button" class="ghost sm" id="btnAll">全选全部大师</button>
          <button type="button" class="ghost sm" id="btnHot">选热门 6 位</button>
          <button type="button" class="ghost sm" id="btnNone">清空</button>
        </div>
        <div class="persons" id="persons"><div class="loading">加载中…</div></div>
      </div>
    </section>

    <section class="block">
      <div class="ex-head">
        <label class="lbl">② 描述你正在纠结的问题</label>
        <span class="reshuffle" id="reshuffle">换一组 ↻</span>
      </div>
      <div class="ex" id="exWrap"></div>
      <textarea id="question" rows="3" placeholder="写下真正压在你心上的那件事，例如：欠了 30 万，每月工资一到手就还债，我该怎么翻身？"></textarea>
      <button id="askBtn" class="primary">提问</button>
    </section>

    <section class="block">
      <div class="res-head">
        <label class="lbl">③ 他们的回答</label>
        <div class="res-tools" id="resTools" hidden>
          <button id="saveImg" class="ghost sm">保存长图</button>
          <button id="clearChat" class="ghost sm">清空对话</button>
        </div>
      </div>
      <div id="results"><div class="empty">还没有回答，先选大师、提个问题吧。</div></div>
    </section>
  </main>

  <!-- 付费弹窗 -->
  <div class="mask" id="payMask" hidden>
    <div class="pay">
      <h3>¥19.9 全解锁，任用全部大师</h3>
      <div class="pkg" id="pkg"></div>
      <p class="tip">扫码付款后，把「付款截图 + 下方用户ID」<b>加作者微信 <span id="authorWx">fuping394319746</span></b> 发送，人工为你解锁。</p>
      <p class="uid">你的用户ID：<span id="myUid">—</span><br><small>复制发给作者即可解锁</small></p>
      <img class="qr" src="/wechat_pay_qr.png" alt="收款码" />
      <button class="close" id="closePay">稍后再说</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/config.js"></script>
  <script src="/html2canvas.min.js"></script>
  <script src="/app.js?v=14"></script>
</body>
</html>
