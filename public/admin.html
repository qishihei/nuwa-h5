<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>解锁后台 · 仅作者可用</title>
<style>
  body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;max-width:480px;margin:40px auto;padding:0 16px;color:#222;}
  h1{font-size:18px;}
  label{display:block;margin:14px 0 4px;font-size:13px;color:#555;}
  input,select{width:100%;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
  button{margin-top:20px;width:100%;padding:12px;font-size:16px;background:#111;color:#fff;border:0;border-radius:8px;}
  .msg{margin-top:16px;padding:10px;border-radius:8px;font-size:14px;display:none;}
  .ok{background:#e8f8ee;color:#0a7a3c;}
  .err{background:#fdecec;color:#b00020;}
  .tip{font-size:12px;color:#999;margin-top:24px;line-height:1.6;}
</style>
</head>
<body>
<h1>解锁后台（仅作者）</h1>
<p style="font-size:13px;color:#888;">朋友扫码付款后，把他的「用户ID」和付款截图发你，确认到账后在此解锁。</p>

<label>管理口令（ADMIN_TOKEN）</label>
<input id="token" type="password" placeholder="在 Render 环境变量里，如 nh2026secret" />

<label>用户ID（朋友在弹窗里复制给你的那串）</label>
<input id="uid" type="text" placeholder="例如 ehkyxn2js7kmv16ou3i" />

<label>套餐</label>
<select id="pkg">
  <option value="lite">轻会员 ¥9.9 / 3 次</option>
  <option value="deep">深度对照 ¥29.9 / 10 次</option>
  <option value="master">大师包 ¥99 / 40 次</option>
</select>

<button id="go">确认解锁</button>
<div class="msg" id="msg"></div>

<hr style="border:none;border-top:1px solid #eee;margin:24px 0;" />
<h1 style="font-size:16px;">热点问题（全用户真实点击）</h1>
<button id="statsBtn" style="background:#5a4a36;">查看热点排名</button>
<div class="msg" id="statsMsg"></div>

<hr style="border:none;border-top:1px solid #eee;margin:24px 0;" />
<h1 style="font-size:16px;">用户真实提问（内容选题库）</h1>
<button id="qBtn" style="background:#5a4a36;">查看用户都问了啥</button>
<div class="msg" id="qMsg"></div>

<p class="tip">入口：https://你的域名.onrender.com/admin.html（URL 不公开，且必须口令正确才能改数据，外人进不来）。</p>

<script src="/config.js"></script>
<script>
const $ = s => document.querySelector(s);
const API = window.API_BASE || '';
$('#go').onclick = async () => {
  const token = $('#token').value.trim();
  const uid = $('#uid').value.trim();
  const pkg = $('#pkg').value;
  const msg = $('#msg');
  msg.style.display = 'none';
  if (!token || !uid) { msg.className='msg err'; msg.style.display='block'; msg.textContent='口令和用户ID都要填'; return; }
  try {
    const r = await fetch(API + '/api/admin/unlock', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ admin_token: token, uid, pkg }) });
    const d = await r.json();
    msg.style.display = 'block';
    if (r.ok) { msg.className='msg ok'; msg.textContent = '解锁成功！该用户剩余次数：' + d.remaining + '（已加 ' + d.added + ' 次）'; }
    else { msg.className='msg err'; msg.textContent = '失败：' + (d.error||'未知错误'); }
  } catch(e) { msg.className='msg err'; msg.style.display='block'; msg.textContent='请求出错：'+e.message; }
};

$('#statsBtn').onclick = async () => {
  const token = $('#token').value.trim();
  const msg = $('#statsMsg');
  msg.style.display = 'none';
  if (!token) { msg.className='msg err'; msg.style.display='block'; msg.textContent='请先填管理口令'; return; }
  try {
    const r = await fetch(API + '/api/admin/pain-stats?admin_token=' + encodeURIComponent(token));
    const d = await r.json();
    msg.style.display = 'block';
    if (!r.ok) { msg.className='msg err'; msg.textContent = '失败：' + (d.error||'未知错误'); return; }
    if (!d.rows.length) { msg.className='msg ok'; msg.textContent = '暂无点击记录。让朋友在首页多点几个示例问题。'; return; }
    msg.className='msg ok';
    msg.style.whiteSpace='pre-wrap';
    msg.textContent = '热点问题排名（全用户）:\n\n' + d.rows.map((x,i)=>(i+1)+'. '+(x.n)+' 次 — '+x.q).join('\n');
  } catch(e) { msg.className='msg err'; msg.style.display='block'; msg.textContent='请求出错：'+e.message; }
};

$('#qBtn').onclick = async () => {
  const token = $('#token').value.trim();
  const msg = $('#qMsg');
  msg.style.display = 'none';
  if (!token) { msg.className='msg err'; msg.style.display='block'; msg.textContent='请先填管理口令'; return; }
  try {
    const r = await fetch(API + '/api/admin/questions?admin_token=' + encodeURIComponent(token));
    const d = await r.json();
    msg.style.display = 'block';
    if (!r.ok) { msg.className='msg err'; msg.textContent = '失败：' + (d.error||'未知错误'); return; }
    let txt = '共收到 ' + d.total + ' 条提问。\n\n【高频重复 TOP】\n' +
      (d.top.length ? d.top.map((x,i)=>(i+1)+'. '+(x.n)+' 次 — '+x.q).join('\n') : '（暂无）') +
      '\n\n【最近提问】\n' +
      (d.recent.length ? d.recent.map(x=>('['+x.type+'] '+x.q)).join('\n') : '（暂无）');
    msg.className='msg ok';
    msg.style.whiteSpace='pre-wrap';
    msg.textContent = txt;
  } catch(e) { msg.className='msg err'; msg.style.display='block'; msg.textContent='请求出错：'+e.message; }
};
</script>
</body>
</html>
